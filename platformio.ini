[env:ATmega328P]
platform = atmelavr
board = ATmega328P
framework = arduino
upload_protocol = custom
upload_command = avrdude -C "$PROJECT_PACKAGES_DIR/tool-avrdude/avrdude.conf" -p atmega328p -c xplainedmini -P usb -F -e -V -U flash:w:$SOURCE:i
lib_deps = 
	marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    Keypad
	adafruit/RTClib @ ^2.1.4
    adafruit/Adafruit SHT31 Library
    arduino-libraries/SD @ ^1.2.4
	adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.3